    instruction: partial_credit
    scope: question_by_question
    decomposition: holistic
    dataset: harmogenr
    domain: code
    k: 3
    max_tokens: 32768

  # GLM-5.1 through OpenRouter, code only (amendment 2026-10-18, before any GLM result was compared): OpenRouter
  # throttled it to a few requests per minute, and in the study its partial-credit runs were code-only too.
