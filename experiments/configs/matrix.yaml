    dataset: harmogenr
    domain: code
    k: 3


  - name: v_harm_reasoning_open
    store: verification.jsonl
    corpus: corpus_verification.parquet
    model: [qwen3.5, deepseek-v4-flash]
    reasoning: on
    context_level: with_guidance
    instruction: partial_credit
    scope: question_by_question
    decomposition: holistic
    dataset: harmogenr
