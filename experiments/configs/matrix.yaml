# Pruned experimental matrix (Phase 4.1, CLAUDE.md §6/§7).
#
# Arms map 1:1 to the Phase 4 steps. expand_arm() crosses the list-valued axes and
# SKIPS inapplicable cells (whole_exam / criterion = PT-CS only; domain must exist in the
# dataset), so a single arm can name all datasets/domains and the invalid combinations
# drop out automatically. Cells shared between arms collapse via the (config_hash,
# run_index) cache -> the estimator reports both per-arm gross and the deduped real spend.
#
# Pruning levers (§7): full factorial on the cheap axes at k=5; the reasoning-ON cells are
# SAMPLED (sampling.reasoning_on_subsample); the paid anchor runs a reduced set at k=3.
# N-per-condition values here are PROPOSALS for §11 -- adjust before running.

sampling:
  # Items per (dataset:domain) for question-by-question cells (capped at availability).
  # Scaled AGGRESSIVELY for the cheap OFF cells (user 2026-06-09): they power the
  # non-reasoning main effects (RQ4) + context arm (RQ2) and dedupe into the reasoning-OFF
  # side -- whole dataset where viable. The expensive ON cells are capped separately below;
  # the paid anchor is pinned small via its own item_cap (it is a reference point, not an
  # object of inference). Strong power where we infer, containment where we only reference.
  question_by_question:
    mohler:short_answer: 2273    # all of Mohler
    semeval:short_answer: 800    # SemEval is 16k -> sample (still the largest cell)
    riayn:code: 149              # all of RIAYN
    ptcs:code: 737               # all PT-CS code
    ptcs:short_answer: 437       # all PT-CS theory
    saf:short_answer: 300        # additional verification (2026-10-18): a seeded random 300 of SAF's 2981
    harmogenr:code: 129          # additional verification: every non-empty HARMOGEN-R code answer
  reasoning_on_subsample: 175    # RQ1 axis: moderate power on the key contrast (was 60); still a few €
  whole_exam_submissions: 60     # PT-CS submissions graded as one call each (scope arm, RQ3)
  conversation_submissions: 80   # C4 (2026-10-15): 20 -> 80 exams; the seeded prefix nests, so the first 20 are reused
  conversation_orders: 2         # answer-order permutations for order control (§11 open: shuffle vs fixed)
  conversation_shared_input_factor: 4   # shared-history input inflation (accumulating context)

# Rough wall-clock model (seconds/call) for the time estimate; reconciled from real latency
# at the 4.4 gate. DeepInfra/OpenAI tolerate parallel requests -> divide by `concurrency`.
latency_s: { "off": 2.0, "on": 18.0, "whole_exam_off": 5.0, "whole_exam_on": 45.0 }  # quote off/on (YAML 1.1 booleans)
concurrency: 8

# Per-call token assumptions (input, output) by domain|scope|decomposition|reasoning.
# Seeded from the Phase 3.8 smoke + headroom; the cost guard logs real usage and reconciles.
tokens:
  short_answer|question_by_question|holistic|off: [200, 12]
  short_answer|question_by_question|holistic|on:  [200, 1200]   # observed ON mean ~0.9k, p90 ~2.5k
  code|question_by_question|holistic|off:         [450, 120]
  code|question_by_question|holistic|on:          [450, 3000]   # code reasoning runs longer
  code|question_by_question|criterion|off:        [480, 180]
  code|question_by_question|criterion|on:         [480, 1100]
  code|whole_exam|holistic|off:                   [2800, 500]
  code|whole_exam|holistic|on:                    [2800, 3000]

arms:
  - name: baseline                 # 4.2 internal reference (Qwen3.5, off, grounded, q-by-q, holistic)
    model: qwen3.5
    reasoning: off
    context_level: with_guidance
    scope: question_by_question
    decomposition: holistic
    dataset: [mohler, semeval, riayn, ptcs]
    domain: [short_answer, code]
    k: 5

  - name: nonreasoning_main        # 4.3 roster main effects, reasoning OFF
    model: [qwen3.5, deepseek-v4-flash, glm-5.1]
    reasoning: off
    context_level: with_guidance
    scope: question_by_question
    decomposition: holistic
    dataset: [mohler, semeval, riayn, ptcs]
    domain: [short_answer, code]
    k: 5

  - name: reasoning_arm            # 4.5 reasoning OFF vs ON across the roster (ON sampled)
    model: [qwen3.5, deepseek-v4-flash, glm-5.1]
    reasoning: [off, on]
    context_level: with_guidance
    scope: question_by_question
    decomposition: holistic
    dataset: [mohler, semeval, riayn, ptcs]
    domain: [short_answer, code]
    k: 5

  - name: decomposition_arm        # 4.6 PT-CS holistic vs criterion-by-criterion
    model: qwen3.5
    reasoning: off
    context_level: with_guidance
    scope: question_by_question
    decomposition: [holistic, criterion]
    dataset: ptcs
    domain: code
    k: 5

  - name: scope_arm                # 4.7 PT-CS question-by-question vs whole-exam
    model: qwen3.5
    reasoning: off
    context_level: with_guidance
    scope: [question_by_question, whole_exam]
    decomposition: holistic
    dataset: ptcs
    domain: code
    k: 5

  - name: context_arm              # 4.8 no-rubric vs with-guidance (few-shot deferred, §11)
    model: qwen3.5
    reasoning: off
    context_level: [none, with_guidance]
    scope: question_by_question
    decomposition: holistic
    dataset: [mohler, semeval, riayn, ptcs]
    domain: [short_answer, code]
    k: 5

  - name: conversation_substudy    # 4.9 PT-CS clean vs shared history (order-controlled)
    model: qwen3.5
    reasoning: off
    context_level: with_guidance
    scope: question_by_question
    decomposition: holistic
    conversation_state: [clean, shared]
    dataset: ptcs
    domain: code
    k: 5                           # C4 (2026-10-15): 3 -> 5, parity with the main matrix; runs 0-2 reused

  - name: anchor_reduced           # 4.10 GPT-5.1 paid anchor, reduced set, k=3, OFF vs ON
    model: gpt-5.1
    reasoning: [off, on]
    context_level: with_guidance
    scope: question_by_question
    decomposition: holistic
    dataset: [mohler, semeval, riayn, ptcs]
    domain: [short_answer, code]
    k: 3
    item_cap: 60                   # PIN small: a reference point ($10/1M out), not statistical inference

  # --- reasoning-ON RE-RUN (2026-06-09): the original ON cells truncated at max_tokens=4096
  #     (finish_reason=length; Qwen3.5 lost 50% of its long traces -> RQ1 bias). These re-run
  #     the ON cells ONLY at max_tokens=32768 (a NEW config_hash, so the clean OFF cells stay
  #     cached and are NOT touched). High cap chosen because the 4096 p99 was censored (it
  #     excluded the very traces that overflowed); over-spec costs only the long tail's real
  #     tokens, under-spec costs a third re-run. Pairs against the existing OFF rows for RQ1.
  - name: reasoning_on_fix         # open roster, reasoning ON, full token budget
    model: [qwen3.5, deepseek-v4-flash, glm-5.1]
    reasoning: on
    context_level: with_guidance
    scope: question_by_question
    decomposition: holistic
    dataset: [mohler, semeval, riayn, ptcs]
    domain: [short_answer, code]
    k: 5
    max_tokens: 32768

  - name: anchor_on_fix            # GPT-5.1 anchor, reasoning ON, full token budget (k=3, capped)
    model: gpt-5.1
    reasoning: on
    context_level: with_guidance
    scope: question_by_question
    decomposition: holistic
    dataset: [mohler, semeval, riayn, ptcs]
    domain: [short_answer, code]
    k: 3
    item_cap: 60
    max_tokens: 32768

  # --- Bloco C (advisor review, user-approved 2026-10-15). k=5 throughout; k and run_index are not
  #     in config_hash, so earlier runs 0..k-1 of the same cells are reused. item_filter
  #     ptcs_validated restricts PT-CS to the teacher-validated answers the paper analyses. ---
  # GLM-5.1 is not used in bloco C: its reasoning can no longer be switched off on DeepInfra (2026-10-15).
  - name: c1_context_roster        # C1: guidance none vs with on DeepSeek (RQ2 beyond one model)
    model: deepseek-v4-flash
    reasoning: off
    context_level: [none, with_guidance]
    scope: question_by_question
    decomposition: holistic
    dataset: [mohler, semeval, riayn, ptcs]
    domain: [short_answer, code]
    k: 5
    item_filter: ptcs_validated

  - name: c1_context_gpt           # C1: guidance none vs with on GPT-5.1 (third family; OpenAI, 16x)
    model: gpt-5.1
    reasoning: off
    context_level: [none, with_guidance]
    scope: question_by_question
    decomposition: holistic
    dataset: [mohler, semeval, riayn, ptcs]
    domain: [short_answer, code]
    k: 5
    item_filter: ptcs_validated

  - name: c2_decomposition         # C2: holistic vs criterion on RIAYN (public code) and PT-CS, Qwen + DeepSeek
    model: [qwen3.5, deepseek-v4-flash]
    reasoning: off
    context_level: with_guidance
    scope: question_by_question
    decomposition: [holistic, criterion]
    dataset: [riayn, ptcs]
    domain: code
    k: 5
    item_filter: ptcs_validated

  - name: c5_anchor_full_off       # C5: GPT-5.1 off on every item the open models graded (k=5)
    model: gpt-5.1
    reasoning: off
    context_level: with_guidance
    scope: question_by_question
    decomposition: holistic
    dataset: [mohler, semeval, riayn, ptcs]
    domain: [short_answer, code]
    k: 5
    item_filter: ptcs_validated

  - name: c5_anchor_full_on        # C5: GPT-5.1 on, same 175-item reasoning samples as the open models (k=5)
    model: gpt-5.1
    reasoning: on
    context_level: with_guidance
    scope: question_by_question
    decomposition: holistic
    dataset: [mohler, semeval, riayn, ptcs]
    domain: [short_answer, code]
    k: 5
    max_tokens: 32768
    item_filter: ptcs_validated

  # --- Pedro's review (2026-10-16). GLM-5.1 cannot be run: DeepInfra no longer lists it and answers
  #     zai-org/GLM-5.1 requests with GLM-5.3, which reasons even with enable_thinking=false (checked
  #     2026-10-16: 195-1763 output tokens against 10 in June). Qwen3.5 and DeepSeek-V4-Flash still
  #     reproduce their June outputs (same served model, 7 output tokens). ---
  - name: c3_gpt_decomposition     # RQ3 on the same three models as RQ2: GPT-5.1 holistic vs criterion
    model: gpt-5.1
    reasoning: off
    context_level: with_guidance
    scope: question_by_question
    decomposition: [holistic, criterion]
    dataset: [riayn, ptcs]
    domain: code
    k: 5
    item_filter: ptcs_validated

  # Grading-instruction experiment, stage 1 (code). standard = the original prompt re-run in the same
  # batch (drift guard); partial_credit / partial_credit_justified = the variants in prompts_instruction.yaml.
  # Own store, so the standard re-run never mixes with the original baseline rows (same config_hash).
  - name: i1_instruction_code
    store: instruction.jsonl
    model: [qwen3.5, deepseek-v4-flash]            # GPT-5.1 runs in i4 (partial credit only; Batch API)
    reasoning: off
    context_level: with_guidance
    scope: question_by_question
    decomposition: holistic
    instruction: [standard, partial_credit, partial_credit_justified]
    dataset: [riayn, ptcs]
    domain: code
    k: 5
    item_filter: ptcs_validated

  # Stage 2 (short answers). Stage 1 on the open models (2026-10-16): partial credit raised DeepSeek-V4-Flash
  # by 0.06-0.07 on both code sets (significant after Holm) and lowered nothing; it did not repair Qwen3.5's
  # zeros. The justification variant was unstable (it lowered DeepSeek on PT-CS) and is not carried forward.
  # Stage 2 checks the partial-credit instruction on the short-answer sets, with the same-batch strict re-run.
  - name: i2_instruction_short
    store: instruction.jsonl
    model: [qwen3.5, deepseek-v4-flash]            # GPT-5.1 runs in i4 (partial credit only; Batch API)
    reasoning: off
    context_level: with_guidance
    scope: question_by_question
    decomposition: holistic
    instruction: [standard, partial_credit]
    dataset: [mohler, semeval, ptcs]
    domain: short_answer
    k: 5
    item_filter: ptcs_validated

  # Claude Sonnet 4.6 (Pedro's review 2026-10-16): a second closed model, reasoning off, strict and partial-credit
  # instruction on every item, through the Message Batches API (-50%; experiments/run/batch_runner.py). Its
  # JSON-only answer is enforced with the API's structured output (adapter_api.build_anthropic_payload).
  - name: i3_sonnet
    store: instruction.jsonl
    model: claude-sonnet-4-6
    reasoning: off
    context_level: with_guidance
    scope: question_by_question
    decomposition: holistic
    instruction: [standard, partial_credit]
    dataset: [mohler, semeval, riayn, ptcs]
    domain: [short_answer, code]
    k: 5
    item_filter: ptcs_validated
    item_cap: 800                  # Mohler: the first 800 of its seeded order (as SemEval), to keep the subset near $20;
                                   # the structured output adds ~150 input tokens per call (measured 2026-10-16)

  # GPT-5.1 with the partial-credit instruction (Batch API). Its strict cells are the C5 rows of the main store
  # (the same-batch strict re-runs of Qwen3.5 and DeepSeek-V4-Flash reproduced their original rows, so GPT's
  # strict re-run was skipped to save cost). Code first; short answers next.
  - name: i4_gpt_partial_code
    store: instruction.jsonl
    model: gpt-5.1
    reasoning: off
    context_level: with_guidance
    scope: question_by_question
    decomposition: holistic
    instruction: partial_credit
    dataset: [riayn, ptcs]
    domain: code
    k: 5
    item_filter: ptcs_validated

  - name: i4_gpt_partial_short
    store: instruction.jsonl
    model: gpt-5.1
    reasoning: off
    context_level: with_guidance
    scope: question_by_question
    decomposition: holistic
    instruction: partial_credit
    dataset: [mohler, semeval, ptcs]
    domain: short_answer
    k: 5
    item_filter: ptcs_validated

# RQ6 transfer dependency (§11): the public-dataset winner needs a like-for-like PT-CS run
# for 5.5b. SATISFIED structurally -- ptcs(code) is included in baseline, nonreasoning_main,
# reasoning_arm, context_arm AND anchor_reduced, so EVERY candidate config (any model x
# {off,on} x {none,with_guidance}) already has a PT-CS counterpart. No separate transfer arm.

  # GLM-5.1 through OpenRouter (Z.AI pinned). OpenRouter caps new accounts at roughly 20-40 requests per minute
  # on this model whatever the provider (429 'new-account-rpm', 2026-10-16), so the full design (strict and
  # partial credit on every item, 21,280 calls, 10-18 h) was cut to where the instruction matters: partial credit
  # on code, and the strict instruction on RIAYN as a check that this backend reproduces the June DeepInfra rows.
  - name: i5_glm_code_partial
    store: instruction.jsonl
    model: glm-5.1-or
    reasoning: off
    context_level: with_guidance
    scope: question_by_question
    decomposition: holistic
    instruction: partial_credit
    dataset: [riayn, ptcs]
    domain: code
    k: 5
    item_filter: ptcs_validated

  - name: i5_glm_riayn_strict
    store: instruction.jsonl
    model: glm-5.1-or
    reasoning: off
    context_level: with_guidance
    scope: question_by_question
    decomposition: holistic
    instruction: standard
    dataset: riayn
    domain: code
    k: 5

# Additional verification of the guide (2026-10-18; protocol fixed in CLAUDE.md §11 before any call). Two datasets
# that played no part in building the guide, in their own corpus file and store: SAF (English short answers on
# communication networks, reference answers) and HARMOGEN-R (C++ code answers in Portuguese, the instructors'
# rubric). The guide is with guidance + partial credit + reasoning off + one question per call + holistic; every
# alternative changes ONE of those settings: no guidance, the strict instruction, reasoning on, or (code) a score per
# criterion, still with partial credit. Five models, k = 3. GPT-5.1 and Claude Sonnet 4.6 go through the batch APIs.
  - name: v_saf_open
    store: verification.jsonl
    corpus: corpus_verification.parquet
    model: [qwen3.5, deepseek-v4-flash]
    reasoning: off
    context_level: [none, with_guidance]
    instruction: [standard, partial_credit]        # none + partial_credit is undefined and drops out
    scope: question_by_question
    decomposition: holistic
    dataset: saf
    domain: short_answer
    k: 3

  - name: v_saf_gpt
    store: verification.jsonl
    corpus: corpus_verification.parquet
    model: gpt-5.1
    reasoning: off
    context_level: [none, with_guidance]
    instruction: [standard, partial_credit]
    scope: question_by_question
    decomposition: holistic
    dataset: saf
    domain: short_answer
    k: 3

  - name: v_saf_claude
    store: verification.jsonl
    corpus: corpus_verification.parquet
    model: claude-sonnet-4-6
    reasoning: off
    context_level: [none, with_guidance]
    instruction: [standard, partial_credit]
    scope: question_by_question
    decomposition: holistic
    dataset: saf
    domain: short_answer
    k: 3

  - name: v_saf_reasoning_open
    store: verification.jsonl
    corpus: corpus_verification.parquet
    model: [qwen3.5, deepseek-v4-flash]
    reasoning: on
    context_level: with_guidance
    instruction: partial_credit
    scope: question_by_question
    decomposition: holistic
    dataset: saf
    domain: short_answer
    k: 3
    item_cap: 150                  # the first 150 of the same seeded order, so they nest in the 300
    max_tokens: 32768

  - name: v_saf_reasoning_gpt
    store: verification.jsonl
    corpus: corpus_verification.parquet
    model: gpt-5.1
    reasoning: on
    context_level: with_guidance
    instruction: partial_credit
    scope: question_by_question
    decomposition: holistic
    dataset: saf
    domain: short_answer
    k: 3
    item_cap: 150
    max_tokens: 32768

  - name: v_harm_open
    store: verification.jsonl
    corpus: corpus_verification.parquet
    model: [qwen3.5, deepseek-v4-flash]
    reasoning: off
    context_level: [none, with_guidance]
    instruction: [standard, partial_credit]
    scope: question_by_question
    decomposition: holistic
    dataset: harmogenr
    domain: code
    k: 3

  - name: v_harm_criterion_open
